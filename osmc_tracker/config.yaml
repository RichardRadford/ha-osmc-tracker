name: OSMC Watch Tracker
version: "1.0.0"
slug: osmc_tracker
description: Logs everything played on OSMC/Kodi – what, when and for how long – with stats and HA sensors
url: https://github.com/RichardRadford/ha-osmc-tracker
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:television-play
panel_title: OSMC Tracker
homeassistant_api: true
backup_exclude: []
options:
  kodi_host: osmc.local
  kodi_port: 9090
  poll_interval: 10
  min_session_seconds: 60
  completed_percent: 90
  publish_sensors: true
  entity_prefix: osmc
  log_level: info
schema:
  kodi_host: str
  kodi_port: port
  poll_interval: int(2,120)
  min_session_seconds: int(0,3600)
  completed_percent: int(1,100)
  publish_sensors: bool
  entity_prefix: match(^[a-z0-9_]+$)
  log_level: list(debug|info|warning|error)
